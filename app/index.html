<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f8fafc;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        .tab-active {
            color: #f8fafc;
            border-bottom: 2px solid #f8fafc;
        }
        .tab-inactive {
            color: #64748b;
            border-bottom: 2px solid transparent;
        }
        .tab-inactive:hover {
            color: #94a3b8;
        }

        .score-bar {
            transition: width 0.6s ease;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <div class="w-full max-w-3xl glass rounded-3xl shadow-2xl p-8 md:p-12 space-y-8 transition-all duration-300">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                Documentation AI Assistant
            </h1>
            <p class="text-slate-400 text-sm font-medium">
                Ask questions over indexed documentation
            </p>
        </header>

        <!-- Tab Switcher -->
        <div class="flex justify-center space-x-8 border-b border-slate-800 pb-0">
            <button id="tabAsk" onclick="switchTab('ask')" class="tab-active pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors">
                Ask Questions
            </button>
            <button id="tabEval" onclick="switchTab('eval')" class="tab-inactive pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors">
                Evaluation Dashboard
            </button>
        </div>

        <!-- ==================== ASK TAB ==================== -->
        <div id="panelAsk" class="space-y-6">
            <div class="space-y-4">
                <div class="relative group">
                    <textarea 
                        id="question" 
                        rows="4" 
                        class="w-full bg-slate-900/50 border border-slate-800 rounded-2xl p-5 text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-white/10 focus:border-white/20 transition-all resize-none text-base"
                        placeholder="Ask about the documentation..."
                    ></textarea>
                </div>
                
                <button 
                    id="askButton"
                    onclick="askQuestion()"
                    class="w-full py-4 px-6 bg-white hover:bg-slate-200 text-black font-semibold rounded-2xl transition-all duration-200 transform hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center space-x-2"
                >
                    <span id="buttonText">Ask Documentation</span>
                    <div id="loader" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-black border-t-transparent"></div>
                </button>
            </div>

            <!-- Result Section -->
            <div id="resultContainer" class="hidden space-y-6 pt-4">
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Answer</h3>
                        <span id="providerTag" class="text-[10px] mono px-2 py-0.5 rounded border border-slate-700 text-slate-500 uppercase tracking-tighter"></span>
                    </div>
                    <div id="answer" class="text-slate-200 leading-relaxed text-lg whitespace-pre-wrap"></div>
                </div>

                <div id="citationsContainer" class="hidden space-y-3">
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Sources</h3>
                    <div id="citations" class="flex flex-wrap gap-2"></div>
                </div>
            </div>

            <div id="error" class="hidden p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center"></div>
        </div>

        <!-- ==================== EVAL TAB ==================== -->
        <div id="panelEval" class="hidden space-y-6">

            <!-- Run Button -->
            <button 
                id="evalButton"
                onclick="runEvaluation()"
                class="w-full py-4 px-6 bg-white hover:bg-slate-200 text-black font-semibold rounded-2xl transition-all duration-200 transform hover:scale-[1.01] active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
            >
                <span id="evalButtonText">Run Evaluation Suite</span>
                <div id="evalLoader" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-black border-t-transparent"></div>
            </button>

            <!-- Summary Cards -->
            <div id="evalSummary" class="hidden">
                <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Summary Metrics</h3>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="metricCards"></div>
            </div>

            <!-- Score Bars -->
            <div id="evalBars" class="hidden space-y-4">
                <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Score Overview</h3>
                <div id="barContainer" class="space-y-3"></div>
            </div>

            <!-- Detail Table -->
            <div id="evalDetails" class="hidden">
                <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-4">Detailed Results</h3>
                <div class="overflow-x-auto rounded-xl border border-slate-800">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-900/80 text-slate-400 uppercase text-[11px] tracking-wider">
                            <tr>
                                <th class="px-4 py-3">Question</th>
                                <th class="px-4 py-3 text-center">Retrieval</th>
                                <th class="px-4 py-3 text-center">Citation</th>
                                <th class="px-4 py-3 text-center">Relevance</th>
                                <th class="px-4 py-3 text-center">Faithful</th>
                            </tr>
                        </thead>
                        <tbody id="evalTableBody" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>

            <div id="evalError" class="hidden p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center"></div>
        </div>
    </div>

    <script>
        /* ── Tab Switching ── */
        function switchTab(tab) {
            const askTab = document.getElementById('tabAsk');
            const evalTab = document.getElementById('tabEval');
            const askPanel = document.getElementById('panelAsk');
            const evalPanel = document.getElementById('panelEval');

            if (tab === 'ask') {
                askTab.className = 'tab-active pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors';
                evalTab.className = 'tab-inactive pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors';
                askPanel.classList.remove('hidden');
                evalPanel.classList.add('hidden');
            } else {
                evalTab.className = 'tab-active pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors';
                askTab.className = 'tab-inactive pb-3 text-sm font-semibold uppercase tracking-wider cursor-pointer transition-colors';
                evalPanel.classList.remove('hidden');
                askPanel.classList.add('hidden');
            }
        }

        /* ── Ask Question ── */
        async function askQuestion() {
            const questionText = document.getElementById('question').value.trim();
            const askButton = document.getElementById('askButton');
            const buttonText = document.getElementById('buttonText');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const answerDiv = document.getElementById('answer');
            const citationsDiv = document.getElementById('citations');
            const citationsContainer = document.getElementById('citationsContainer');
            const errorDiv = document.getElementById('error');

            if (!questionText) return;

            askButton.disabled = true;
            buttonText.textContent = 'Thinking...';
            loader.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: questionText }),
                });

                if (!response.ok) throw new Error('Failed to get an answer from the server.');

                const data = await response.json();
                answerDiv.textContent = data.answer;
                
                document.getElementById('providerTag').textContent = data.provider;

                citationsDiv.innerHTML = '';
                if (data.citations && data.citations.length > 0) {
                    data.citations.forEach(cit => {
                        const link = document.createElement('a');
                        link.href = cit.url;
                        link.target = '_blank';
                        link.className = 'px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-xs mono text-slate-400 hover:text-white transition-colors';
                        link.textContent = cit.title || cit.url;
                        citationsDiv.appendChild(link);
                    });
                    citationsContainer.classList.remove('hidden');
                } else {
                    citationsContainer.classList.add('hidden');
                }
                resultContainer.classList.remove('hidden');
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                askButton.disabled = false;
                buttonText.textContent = 'Ask Documentation';
                loader.classList.add('hidden');
            }
        }

        document.getElementById('question').addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') askQuestion();
        });

        /* ── Helpers ── */
        function scoreColor(val, max) {
            const ratio = val / max;
            if (ratio >= 0.7) return { text: 'text-emerald-400', bg: 'bg-emerald-500', dot: '●' };
            if (ratio >= 0.4) return { text: 'text-amber-400', bg: 'bg-amber-500', dot: '●' };
            return { text: 'text-red-400', bg: 'bg-red-500', dot: '●' };
        }

        function boolBadge(val) {
            return val
                ? '<span class="text-emerald-400 font-semibold">✓</span>'
                : '<span class="text-red-400 font-semibold">✗</span>';
        }

        function createBar(label, value, max) {
            const pct = Math.round((value / max) * 100);
            const c = scoreColor(value, max);
            return `
                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-400">${label}</span>
                        <span class="${c.text} mono font-semibold">${value} / ${max}</span>
                    </div>
                    <div class="h-2 bg-slate-800 rounded-full overflow-hidden">
                        <div class="score-bar h-full ${c.bg} rounded-full" style="width: ${pct}%"></div>
                    </div>
                </div>`;
        }

        function createMetricCard(label, value) {
            return `
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-center space-y-1">
                    <div class="text-2xl font-bold text-white mono">${value}</div>
                    <div class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">${label}</div>
                </div>`;
        }

        /* ── Evaluation ── */
        async function runEvaluation() {
            const btn = document.getElementById('evalButton');
            const btnText = document.getElementById('evalButtonText');
            const evalLoader = document.getElementById('evalLoader');
            const evalError = document.getElementById('evalError');

            btn.disabled = true;
            btnText.textContent = 'Running evaluation…';
            evalLoader.classList.remove('hidden');
            evalError.classList.add('hidden');

            try {
                const res = await fetch('/evaluate');
                if (!res.ok) throw new Error('Evaluation request failed.');
                const data = await res.json();

                if (data.error) {
                    evalError.textContent = data.error;
                    evalError.classList.remove('hidden');
                    return;
                }

                const s = data.summary;

                // Summary cards
                const cards = document.getElementById('metricCards');
                cards.innerHTML =
                    createMetricCard('Precision@3', (s.precision_at_3 * 100).toFixed(0) + '%') +
                    createMetricCard('Citation Acc.', (s.citation_accuracy * 100).toFixed(0) + '%') +
                    createMetricCard('Avg Relevance', s.avg_relevance_score.toFixed(1) + ' / 5') +
                    createMetricCard('Avg Faithfulness', s.avg_faithfulness_score.toFixed(1) + ' / 5') +
                    createMetricCard('Questions', s.total_questions);
                document.getElementById('evalSummary').classList.remove('hidden');

                // Score bars
                const bars = document.getElementById('barContainer');
                bars.innerHTML =
                    createBar('Precision@3', s.precision_at_3, 1) +
                    createBar('Citation Accuracy', s.citation_accuracy, 1) +
                    createBar('Avg Relevance', s.avg_relevance_score, 5) +
                    createBar('Avg Faithfulness', s.avg_faithfulness_score, 5);
                document.getElementById('evalBars').classList.remove('hidden');

                // Detail table
                const tbody = document.getElementById('evalTableBody');
                tbody.innerHTML = '';
                data.details.forEach(d => {
                    const relC = scoreColor(d.relevance_score, 5);
                    const faiC = scoreColor(d.faithfulness_score, 5);
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-900/50 transition-colors">
                            <td class="px-4 py-3 text-slate-300 max-w-[200px] truncate" title="${d.question}">${d.question}</td>
                            <td class="px-4 py-3 text-center">${boolBadge(d.retrieval_success)}</td>
                            <td class="px-4 py-3 text-center">${boolBadge(d.citation_accuracy)}</td>
                            <td class="px-4 py-3 text-center ${relC.text} mono font-semibold">${d.relevance_score}</td>
                            <td class="px-4 py-3 text-center ${faiC.text} mono font-semibold">${d.faithfulness_score}</td>
                        </tr>`;
                });
                document.getElementById('evalDetails').classList.remove('hidden');

            } catch (err) {
                evalError.textContent = err.message;
                evalError.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Run Evaluation Suite';
                evalLoader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
